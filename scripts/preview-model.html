<!doctype html>
<html lang="ko">
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>미니핀의 작업실 · 3D 미리보기</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#eee8df;color:#443b34;font-family:system-ui,sans-serif}
header{position:absolute;top:28px;left:36px;z-index:2;pointer-events:none}small{letter-spacing:.18em;color:#857365;font-size:11px}
h1{font-size:24px;font-weight:500;margin:10px 0}p{font-size:13px;color:#857365}canvas{display:block;width:100%;height:100vh}
footer{position:absolute;bottom:22px;left:36px;right:36px;display:flex;justify-content:space-between;align-items:center;font-size:12px;color:#857365}
footer>div{display:flex;flex-wrap:wrap;justify-content:center;gap:6px}
button,a{border:1px solid #c9bbab;background:#f4efe7;padding:10px 16px;border-radius:24px;color:#594d42;text-decoration:none;cursor:pointer}
#status{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%)}
@media(max-width:600px){header{left:18px;top:18px}h1{font-size:19px}footer{left:18px;right:18px;flex-direction:column;gap:12px}button,a{padding:8px 12px}}
</style>
<header><small>MINPIN WORKSPACE / 07</small><h1>미니핀의 작업실</h1><p>검은색 맥북 스타일 노트북과 오른쪽 노트·필기구</p></header>
<div id="status">3D 모델 불러오는 중…</div><canvas aria-label="서 있는 복셀 미니핀이 얇은 검은색 맥북 스타일 노트북을 사용하는 장면. 책상 오른쪽에는 노트와 필기구가 있고, 노트북 뒷면에는 밝은 파형, 위에는 노란색 별과 더하기 일이 표시되어 있습니다."></canvas>
<footer><span>드래그하여 회전 · 스크롤하여 확대</span><div><button id="reset">기본 구도</button><button id="front">반대쪽 보기</button><button id="save">미리보기 저장</button><a href="/dj_park.glb?v=black-macbook-v7" download>GLB 다운로드</a></div></footer>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.148.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.148.0/examples/jsm/"}}</script>
<script type="module">
try {
  const THREE=await import('three')
  const {GLTFLoader}=await import('three/addons/loaders/GLTFLoader.js')
  const {OrbitControls}=await import('three/addons/controls/OrbitControls.js')
  const {setupWorkspaceView,frameWorkspaceView,configureWorkspaceModel}=await import('/workspace-view.js')
  const isReference=new URLSearchParams(location.search).has('reference')
  const canvas=document.querySelector('canvas')
  const renderer=new THREE.WebGLRenderer({canvas,antialias:true,alpha:true,preserveDrawingBuffer:true})
  renderer.setPixelRatio(Math.min(devicePixelRatio,2))
  renderer.outputEncoding=THREE.sRGBEncoding
  renderer.setClearColor(0,0)
  renderer.shadowMap.enabled=true
  renderer.shadowMap.type=THREE.PCFSoftShadowMap
  const scene=new THREE.Scene(),camera=new THREE.OrthographicCamera(-5,5,4,-4,.1,100)
  setupWorkspaceView(THREE,scene,camera)
  const controls=new OrbitControls(camera,canvas)
  controls.target.set(0,2,0)
  controls.enableDamping=true
  controls.enablePan=false
  controls.maxPolarAngle=Math.PI/2-.05
  controls.minZoom=.6
  controls.maxZoom=3
  controls.update()
  let model
  const originalPosition=camera.position.clone()
  function resize(){frameWorkspaceView(THREE,model,camera,controls,innerWidth/innerHeight);renderer.setSize(innerWidth,innerHeight)}
  addEventListener('resize',resize)
  resize()
  function switchView(position){
    // Flush orbit damping before replacing the camera direction, so repeated
    // switches and resets land in exactly the requested view.
    const damping=controls.enableDamping
    controls.enableDamping=false
    controls.update()
    camera.position.copy(position)
    camera.zoom=1
    controls.target.set(0,2,0)
    controls.update()
    resize()
    controls.enableDamping=damping
  }
  document.querySelector('#reset').onclick=()=>switchView(originalPosition)
  document.querySelector('#front').onclick=()=>switchView(new THREE.Vector3(-8,7,-10))
  const loader=new GLTFLoader()
  if(isReference){const {DRACOLoader}=await import('three/addons/loaders/DRACOLoader.js');loader.setDRACOLoader(new DRACOLoader().setDecoderPath('https://cdn.jsdelivr.net/npm/three@0.148.0/examples/jsm/libs/draco/'))}
  loader.load(isReference?'/reference.glb':'/dj_park.glb?v=black-macbook-v7',g=>{
    model=g.scene
    if(isReference){model.traverse(o=>{if(o.name==='Plane')o.name='GroundShadow'})}
    configureWorkspaceModel(model)
    scene.add(model)
    resize()
    document.querySelector('#status').remove()
  },undefined,e=>{document.querySelector('#status').textContent='모델을 불러오지 못했습니다: '+e.message})
  function draw(){requestAnimationFrame(draw);controls.update();renderer.render(scene,camera)}draw()
  document.querySelector('#save').onclick=()=>{renderer.render(scene,camera);canvas.toBlob(async blob=>{await fetch('/capture',{method:'POST',body:blob});document.querySelector('#save').textContent='저장 완료'},'image/png')}
}catch(e){document.querySelector('#status').textContent='미리보기 오류: '+e.message}
</script>
</html>
