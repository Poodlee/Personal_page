<!doctype html><html lang="ko"><meta charset="utf-8"><title>원본 3D 모델 확인</title>
<style>body{margin:0;background:#eee8df;font:15px system-ui}button{position:absolute;top:20px;left:20px;padding:14px}#status{position:absolute;top:80px;left:20px}canvas{display:block}</style>
<button id="save" disabled>원본 모델 데이터 저장</button><div id="status">불러오는 중…</div>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.148.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.148.0/examples/jsm/"}}</script>
<script type="module">
import * as THREE from 'three';import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';import {DRACOLoader} from 'three/addons/loaders/DRACOLoader.js';import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
const r=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});r.setSize(innerWidth,innerHeight);r.setClearColor(0xeee8df);r.outputEncoding=THREE.sRGBEncoding;document.body.append(r.domElement);
const scene=new THREE.Scene(),camera=new THREE.OrthographicCamera(-5,5,4,-4,.1,100);camera.position.set(8,7,10);const controls=new OrbitControls(camera,r.domElement);controls.target.set(0,2,0);controls.update();scene.add(new THREE.AmbientLight(0xffffff,1));const key=new THREE.DirectionalLight(0xffffff,.4);key.position.set(4,8,6);scene.add(key);
new GLTFLoader().setDRACOLoader(new DRACOLoader().setDecoderPath('https://cdn.jsdelivr.net/npm/three@0.148.0/examples/jsm/libs/draco/')).load('/reference.glb',g=>{
scene.add(g.scene);g.scene.updateMatrixWorld(true);const result=[];
g.scene.traverse(o=>{if(!o.isMesh)return;const geom=o.geometry.clone().applyMatrix4(o.matrixWorld),p=geom.attributes.position,n=geom.attributes.normal,uv=geom.attributes.uv,index=geom.index;const image=o.material.map.image,canvas=document.createElement('canvas');canvas.width=image.width;canvas.height=image.height;const context=canvas.getContext('2d');context.drawImage(image,0,0);const rgba=context.getImageData(0,0,canvas.width,canvas.height).data;const sample=(u,v)=>{const x=Math.min(canvas.width-1,Math.max(0,Math.floor(u*canvas.width))),y=Math.min(canvas.height-1,Math.max(0,Math.floor(v*canvas.height))),offset=(y*canvas.width+x)*4;return Array.from(rgba.slice(offset,offset+4))};const triColors=[];const indices=index?Array.from(index.array):Array.from({length:p.count},(_,i)=>i);for(let i=0;i<indices.length;i+=3){const ids=indices.slice(i,i+3),u=ids.reduce((s,j)=>s+uv.getX(j),0)/3,v=ids.reduce((s,j)=>s+uv.getY(j),0)/3;triColors.push(sample(u,v))}result.push({name:o.name,positions:Array.from(p.array),normals:Array.from(n.array),uv:Array.from(uv.array),indices,triColors});});
document.querySelector('#save').disabled=false;document.querySelector('#status').textContent='원본 모델 준비 완료';document.querySelector('#save').onclick=async()=>{await fetch('/reference-data',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(result)});document.querySelector('#status').textContent='데이터 저장 완료'};
},undefined,e=>document.querySelector('#status').textContent=String(e));
function draw(){requestAnimationFrame(draw);controls.update();r.render(scene,camera)}draw();
</script></html>
